<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VitisOS ERP | Sistema Operacional para Produtores de Vinho</title>
    <!-- Tailwind CSS v4 CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Google Fonts & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- SheetJS for Excel Parsing -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0f1117; color: #f3f4f6; }
        .erp-card { background: #181b22; border: 1px solid rgba(255, 255, 255, 0.07); }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- ================= SUPABASE AUTH MODAL ================= -->
    <div id="auth-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/90 backdrop-blur-md p-4">
        <div class="erp-card w-full max-w-md rounded-2xl p-8 shadow-2xl border-t-4 border-rose-800">
            <div class="text-center mb-6">
                <span class="text-rose-500 font-bold tracking-widest text-xs uppercase bg-rose-500/10 px-3 py-1 rounded-full">SaaS Secure Auth</span>
                <h1 class="text-2xl font-bold mt-2">VitisOS Acesso Seguro</h1>
                <p class="text-gray-400 text-xs mt-1">Autentique-se com as credenciais da sua base de dados Supabase.</p>
            </div>

            <div id="auth-error" class="hidden mb-4 p-3 bg-rose-500/10 border border-rose-500/30 text-rose-400 text-xs rounded-lg"></div>

            <form onsubmit="handleSupabaseLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-gray-400 uppercase mb-1">E-mail Profissional</label>
                    <input type="email" id="auth-email" required class="w-full bg-[#12141c] border border-white/10 rounded-lg p-3 text-sm text-white focus:outline-none focus:border-rose-700" placeholder="produtor@quintadobonjardim.pt">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-400 uppercase mb-1">Palavra-passe</label>
                    <input type="password" id="auth-password" required class="w-full bg-[#12141c] border border-white/10 rounded-lg p-3 text-sm text-white focus:outline-none focus:border-rose-700" placeholder="••••••••">
                </div>

                <button type="submit" class="w-full bg-rose-800 hover:bg-rose-700 text-white font-semibold py-3 rounded-lg text-sm transition mt-2 shadow-lg cursor-pointer">
                    Entrar no ERP <i class="fa-solid fa-arrow-right ml-2"></i>
                </button>
            </form>

            <div class="mt-6 text-center text-xs text-gray-500 border-t border-white/5 pt-4">
                Ligado a <span class="text-gray-300">odmyqysfnqkzpkpcsbjq.supabase.co</span>
            </div>
        </div>
    </div>

    <!-- ================= MAIN ERP APP (HIDDEN UNTIL AUTHENTICATED) ================= -->
    <div id="app-container" class="hidden flex h-screen overflow-hidden">
        
        <!-- SIDEBAR LIGHTWEIGHT -->
        <aside class="w-64 erp-card border-r border-white/5 flex flex-col justify-between p-5">
            <div>
                <div class="flex items-center gap-3 mb-8">
                    <div class="bg-rose-800 text-white w-9 h-9 rounded-lg flex items-center justify-center font-bold text-lg">🍇</div>
                    <div>
                        <h2 class="font-bold text-sm tracking-wide">VitisOS <span class="text-rose-500 font-normal text-xs">ERP</span></h2>
                        <span id="sidebar-user-email" class="text-[10px] text-gray-400 block truncate w-36">Sessão Ativa</span>
                    </div>
                </div>

                <nav class="space-y-1">
                    <button onclick="switchTab('dashboard')" class="nav-btn w-full flex items-center gap-3 px-4 py-2.5 rounded-lg text-sm text-gray-300 hover:bg-white/5 hover:text-white transition active bg-white/5 text-white">
                        <i class="fa-solid fa-chart-pie w-5 text-rose-500"></i> Dashboard
                    </button>
                    <button onclick="switchTab('inventory')" class="nav-btn w-full flex items-center gap-3 px-4 py-2.5 rounded-lg text-sm text-gray-300 hover:bg-white/5 hover:text-white transition">
                        <i class="fa-solid fa-boxes-stacked w-5 text-emerald-500"></i> Inventário & Mão de Obra
                    </button>
                    <button onclick="switchTab('ai-expansion')" class="nav-btn w-full flex items-center gap-3 px-4 py-2.5 rounded-lg text-sm text-gray-300 hover:bg-white/5 hover:text-white transition">
                        <i class="fa-solid fa-robot w-5 text-amber-500"></i> Apoios do Estado & IA
                    </button>
                    <button onclick="switchTab('social')" class="nav-btn w-full flex items-center gap-3 px-4 py-2.5 rounded-lg text-sm text-gray-300 hover:bg-white/5 hover:text-white transition">
                        <i class="fa-solid fa-share-nodes w-5 text-blue-500"></i> Social Media Hub
                    </button>
                    <button onclick="switchTab('tourism')" class="nav-btn w-full flex items-center gap-3 px-4 py-2.5 rounded-lg text-sm text-gray-300 hover:bg-white/5 hover:text-white transition">
                        <i class="fa-solid fa-map-location-dot w-5 text-purple-500"></i> Enoturismo & Clube
                    </button>
                </nav>
            </div>

            <div class="border-t border-white/5 pt-4">
                <div class="flex items-center justify-between">
                    <div>
                        <span class="text-xs font-semibold text-emerald-400 block">✓ Supabase Ativo</span>
                        <span class="text-[10px] text-gray-500">RLS & Multi-Tenant</span>
                    </div>
                    <button onclick="handleSupabaseLogout()" class="text-gray-400 hover:text-rose-400 text-sm p-2 cursor-pointer" title="Terminar Sessão">
                        <i class="fa-solid fa-right-from-bracket"></i>
                    </button>
                </div>
            </div>
        </aside>

        <!-- CONTENT AREA -->
        <main class="flex-1 flex flex-col overflow-y-auto">
            <!-- TOP BAR -->
            <header class="erp-card border
